<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat with {{ guider.name }}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #fff;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            background-color: #1E1E1E;
            padding: 15px;
            text-align: center;
            border-bottom: 2px solid #00FFEA;
        }

        header h1 {
            font-size: 28px;
            color: #00FFEA;
        }

        .chat-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            max-width: 600px;
            margin: 20px auto;
            background: #1E1E1E;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 255, 234, 0.3);
            overflow: hidden;
        }

        .chat-header {
            display: flex;
            align-items: center;
            padding: 15px;
            background: #00FFEA;
            color: #121212;
            font-weight: bold;
        }

        .chat-header img {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            margin-right: 15px;
            border: 2px solid #fff;
        }

        .chat-messages {
            flex-grow: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .message {
            padding: 10px 15px;
            margin: 5px 0;
            border-radius: 8px;
            max-width: 70%;
        }

        .user-message {
            background: #00FFEA;
            color: #121212;
            align-self: flex-end;
        }

        .guider-message {
            background: #FFD700;
            color: #121212;
            align-self: flex-start;
        }

        .chat-input {
            display: flex;
            padding: 10px;
            background: #2D2D2D;
            border-top: 2px solid #00FFEA;
        }

        .chat-input input {
            flex-grow: 1;
            padding: 10px;
            border: none;
            border-radius: 5px;
            background: #333;
            color: white;
            font-size: 16px;
        }

        .chat-input button {
            background: #00FFEA;
            color: #121212;
            border: none;
            padding: 10px 15px;
            margin-left: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        .chat-input button:hover {
            background: #FFD700;
            transform: scale(1.05);
        }

    </style>
</head>
<body>

    <header>
        <h1>Chat with {{ guider.name }}</h1>
    </header>

    <div class="chat-container">
        <!-- Guider Info -->
        <div class="chat-header">
            <img src="{{ url_for('static', filename=guider.image) }}" alt="{{ guider.name }}">
            <span>Chat with {{ guider.name }}</span>
        </div>

        <!-- Chat Messages -->
        <div class="chat-messages" id="chat-messages">
            <div class="message guider-message">Hello! How can I assist you today?</div>
        </div>

        <!-- Chat Input -->
        <div class="chat-input">
            <input type="text" id="message-input" placeholder="Type your message...">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        function sendMessage() {
            let input = document.getElementById("message-input");
            let messageText = input.value.trim();
            if (messageText === "") return;

            let chatMessages = document.getElementById("chat-messages");

            // 用户消息
            let userMessage = document.createElement("div");
            userMessage.classList.add("message", "user-message");
            userMessage.innerText = messageText;
            chatMessages.appendChild(userMessage);

            // 清空输入框
            input.value = "";

            // 模拟导游回复
            setTimeout(() => {
                let guiderMessage = document.createElement("div");
                guiderMessage.classList.add("message", "guider-message");
                guiderMessage.innerText = "I received your message! Let me assist you.";
                chatMessages.appendChild(guiderMessage);

                // 滚动到底部
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }, 1000);
        }
    </script>

</body>
</html>
